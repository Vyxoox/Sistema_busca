<!DOCTYPE html>
{% import 'macros.html' as ui %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="icon" href="{{ url_for('static', filename='LOGO_DER.jpg') }}" type="image/jpeg">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form-errors.css')}}">
</head>
    <header>
        <img src="{{ url_for('static', filename='sãopaulo.png') }}" alt="logo do estado de São Paulo" style="width: 125px; height: 125px;">
            <div class="TituloHeader">
                <div class="titulo">Departamento de Estradas e Rodagem</div>
                <div class="subtitulo">Relatório de Funcionários</div>
            </div>
            <div></div>
    </header>
<body>
    <div class="main">
        <div class="login-box">
        <h2>Login</h2>
        {{ ui.flash_messages(compact=True) }}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
            <input type="text" name="login" placeholder="Usuário" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

        </div>
    </div>
        <footer>
            <p>© 2026 Departamento de Estradas de Rodagem – D.E.R. / CGR.9</p>
            <p>Conteúdo Restrito e Sigiloso – Protegido pela LGPD</p>
        </footer>

<script src="{{ url_for('static', filename='js/flash.js') }}"></script>
</body>
</html>
