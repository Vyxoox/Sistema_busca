<!DOCTYPE html>
{% import 'macros.html' as ui %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste SMTP</title>

    <link rel="icon"
          href="{{ url_for('static', filename='LOGO_DER.jpg') }}"
          type="image/jpeg">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #5c80bc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        input[type=email] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form-errors.css')}}">
</head>

<body>
{{ ui.flash_messages() }}

<div class="container">

    <h1>Teste de SMTP</h1>



    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>E-mail destino</label>

        <input
            type="email"
            name="destinatario"
            required
            placeholder="usuario@empresa.gov.br"
        >

        <button type="submit">
            Enviar teste
        </button>

    </form>

</div>
<script src="{{ url_for('static', filename='js/flash.js') }}"></script>
</body>
</html>
